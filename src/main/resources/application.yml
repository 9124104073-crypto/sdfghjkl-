spring:
  application:
    name: buildos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/buildos}
    username: ${DB_USER:buildos}
    password: ${DB_PASSWORD:buildos}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}
  compression:
    enabled: true          # mobile clients on 3G/4G
    mime-types: application/json
  error:
    include-message: never

buildos:
  auth:
    jwt-secret: ${JWT_SECRET:change-me-in-production-min-32-bytes-long!!}
    access-token-ttl: PT24H
    refresh-token-ttl: P30D
  llm:
    # ANTHROPIC_API_KEY is read from the environment by the SDK; never put it here.
    model: claude-opus-5
    effort: high
    max-tokens: 16000
    # Hard ceiling on model spend per agentic takeoff run.
    task-budget-tokens: 60000
  estimate:
    # Applied on top of SOR line items. Sourced from config, not from the model.
    contractor-overhead-pct: 15.0
    contingency-pct: 5.0
    # An estimate whose rate schedule is older than this is downgraded in confidence.
    rate-staleness-warn-days: 180
    rate-staleness-fail-days: 540

logging:
  level:
    com.synapse.buildos: INFO
